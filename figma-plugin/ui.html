<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: Inter, sans-serif; font-size: 13px; margin: 0; padding: 16px; background: #fff; color: #1a1a1a; }
  h2 { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  p  { margin: 0 0 16px; color: #666; line-height: 1.5; }
  button {
    width: 100%; height: 36px; background: #27B2B2; color: #fff;
    border: none; border-radius: 6px; font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  button:hover { background: #1B7D7D; }
  .note { font-size: 11px; color: #999; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
  <h2>Datepicker &amp; Timepicker</h2>
  <p>Creates Datepicker and Timepicker component sets on the current page using ClearPath design tokens.</p>
  <button id="run">▶&nbsp; Create Components</button>
  <p class="note">Components will be placed near the top-left of the canvas.</p>
  <script>
    document.getElementById('run').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'create' } }, '*');
    };
  </script>
</body>
</html>
